services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
    ports:
      - "5432:5432"
    volumes:
      - study_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_assistant"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  study_data:
